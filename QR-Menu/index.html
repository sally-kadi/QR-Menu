<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Brew Co. - Digital Menu</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<header class="header">
    <div class="brand">
        <h1>BREW CO.</h1>
        <p>COFFEE & MORE</p>
    </div>
</header>

<main>

    <section class="hero">
        <img src="images/banner.png" alt="Good Coffee, Good Day">
    </section>

    <h2 class="menu-title">MENU</h2>

    <!-- COFFEE -->
    <section class="category">
        <div class="category-header">
            <h3>☕ COFFEE</h3>
            <span>View all ›</span>
        </div>

        <div class="menu-item">
            <img src="images/coffee.jpg" alt="Latte">
            <div class="item-info">
                <h4>Latte</h4>
                <p>Smooth espresso with steamed milk.</p>
            </div>
            <span class="price">$3.50</span>
        </div>

        <div class="menu-item">
            <img src="images/iced-coffee.jpg" alt="Iced Coffee">
            <div class="item-info">
                <h4>Iced Coffee</h4>
                <p>Chilled coffee over ice.</p>
            </div>
            <span class="price">$2.90</span>
        </div>

        <div class="menu-item">
            <img src="images/americano.jpg" alt="Americano">
            <div class="item-info">
                <h4>Americano</h4>
                <p>Espresso with hot water.</p>
            </div>
            <span class="price">$2.50</span>
        </div>
    </section>


    <!-- NON-COFFEE -->
    <section class="category">
        <div class="category-header">
            <h3>🍵 NON-COFFEE</h3>
            <span>View all ›</span>
        </div>

        <div class="menu-item">
            <img src="images/matcha.jpg" alt="Matcha Latte">
            <div class="item-info">
                <h4>Matcha Latte</h4>
                <p>Smooth matcha with steamed milk.</p>
            </div>
            <span class="price">$4.00</span>
        </div>
    </section>

</main>

</body>
</html>
